name: ML App CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # 1. Checkout code
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # 2. Set up Python
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # -----------------------------
      # 3. Install dependencies
      # -----------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------
      # 4. Run ML + API tests
      # -----------------------------
      - name: Run tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest tests/

      # -----------------------------
      # 5. Login to Docker Hub
      # -----------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -----------------------------
      # 6. Build Docker image
      # -----------------------------
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/diabetes-ml-api:latest .

      # -----------------------------
      # 7. Push Docker image
      # -----------------------------
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/diabetes-ml-api:latest

      # -----------------------------
      # 8. Set up KIND cluster
      # -----------------------------
      - name: Create KIND cluster
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: ml-cluster

      # -----------------------------
      # 9. Deploy to Kubernetes
      # -----------------------------
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yml

      # -----------------------------
      # 10. Verify deployment
      # -----------------------------
      - name: Verify deployment
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ml-app

          echo "=== Pod Describe ==="
          kubectl describe pods -n ml-app || true

          echo "=== Logs ==="
          kubectl logs deployment/diabetes-ml-api -n ml-app --all-containers=true || true

          echo "=== Rollout Status (timeout 60s) ==="
          kubectl rollout status deployment/diabetes-ml-api -n ml-app --timeout=60s || true
